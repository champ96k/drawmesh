<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#5b57d6" />
    <meta
      name="description"
      content="DrawMesh — a local-first, offline-capable whiteboard. Your drawings never leave this device."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>DrawMesh</title>
    <script>
      // The Excalidraw package resolves the bundled hand-drawn fonts through
      // this global. Without it the package falls back to a CDN, which breaks
      // offline usage.
      window.EXCALIDRAW_ASSET_PATH = "/";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>DrawMesh needs JavaScript enabled to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
